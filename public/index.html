<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Feedback System | Karan Garg</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container py-4 py-md-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="card custom-card shadow-xl border-0">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <i class="fas fa-comment-dots fa-3x text-dark mb-2"></i>
                            <h1 class="display-6 fw-bold">Student Feedback System</h1>
                            <p class="text-muted">We value your opinion — share your experience</p>
                        </div>

                        <form id="feedbackForm">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">
                                    <i class="fas fa-user me-1"></i> Full Name
                                </label>
                                <input type="text" id="name" class="form-control form-control-lg" placeholder="Enter your full name" autocomplete="off">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">
                                    <i class="fas fa-envelope me-1"></i> Email Address
                                </label>
                                <input type="email" id="email" class="form-control form-control-lg" placeholder="student@example.com" autocomplete="off">
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">
                                    <i class="fas fa-pen-fancy me-1"></i> Your Feedback
                                </label>
                                <textarea id="feedback" class="form-control form-control-lg" rows="4" placeholder="Write your valuable feedback here..."></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 btn-lg rounded-pill shadow-sm fw-bold">
                                <i class="fas fa-paper-plane me-2"></i>Submit Feedback
                            </button>
                        </form>
                    </div>
                </div>

                <div class="mt-5">
                    <div class="d-flex align-items-center gap-2 mb-3">
                        <i class="fas fa-list-ul fs-4"></i>
                        <h3 class="h4 fw-bold mb-0">All Feedbacks</h3>
                        <span class="badge bg-secondary rounded-pill ms-2" id="feedbackCount">0</span>
                    </div>
                    <div id="feedbackList" class="feedback-list-container">
                        <div class="text-center py-5" id="loadingPlaceholder">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mt-3 text-muted">Loading feedbacks...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer mt-5 py-3 text-center">
        <div class="container">
            <span>Made with <i class="fas fa-heart text-danger"></i> by <strong>Karan Garg</strong></span>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
